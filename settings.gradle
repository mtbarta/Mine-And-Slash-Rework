pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven { url = 'https://maven.parchmentmc.org' }
        maven {
            name = 'NeoForgeGeneral'
            url = 'https://maven.neoforged.net/releases'
        }
          maven {
            // location of the maven that hosts JEI files since January 2023
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            // location of a maven mirror for JEI files, as a fallback
            name = "ModMaven"
            url = "https://modmaven.dev"
        }
        maven {
            name = "Curios"
            url = uri("https://maven.theillusivec4.top/")
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = 'https://repo.spongepowered.org/repository/maven-public'
                }
            }
            filter { includeGroupAndSubgroups('org.spongepowered') }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                }
            }
            filter { includeGroup('org.parchmentmc.data') }
        }
    }


}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

includeBuild("Library-of-Exile-Rework") {
    dependencySubstitution {
        substitute(module("com.robertx22:Library-of-Exile-Rework")).using(project(":"))
    }
}
includeBuild "the_harvest"
includeBuild("ancient_obelisks") {
    dependencySubstitution {
        // map the hyphenated module to the included build
        substitute(module("com.robertx22:ancient-obelisks")).using(project(":"))
    }
}
includeBuild "dungeon_realm"