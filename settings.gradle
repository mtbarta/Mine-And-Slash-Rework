pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven { url = 'https://maven.parchmentmc.org' }
        maven {
            name = 'NeoForgeGeneral'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            // location of the maven that hosts JEI files since January 2023
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            // location of a maven mirror for JEI files, as a fallback
            name = "ModMaven"
            url = "https://modmaven.dev"
        }
        maven {
            name = "Curios"
            url = uri("https://maven.theillusivec4.top/")
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = 'https://repo.spongepowered.org/repository/maven-public'
                }
            }
            filter { includeGroupAndSubgroups('org.spongepowered') }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                }
            }
            filter { includeGroup('org.parchmentmc.data') }
        }
    }

    // Centralized plugin version management
    plugins {
        id 'net.neoforged.gradle.userdev' version '7.1.17'
        id 'me.modmuss50.mod-publish-plugin' version '0.8.4'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Mine-And-Slash-Rework'

// Include subprojects
include 'Library-of-Exile-Rework'
include 'ancient_obelisks'
include 'the_harvest'
include 'dungeon_realm'