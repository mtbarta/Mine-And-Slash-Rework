plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.17'
    id "me.modmuss50.mod-publish-plugin" version '0.8.4'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${mod_archive_name}-${minecraft_version}-root"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Configure run configurations to include all subproject mods
// Runs and main configurations are now in the :mine_and_slash subproject

// Subprojects configuration can be done here if desired to reduce duplication
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'net.neoforged.gradle.userdev'
}

// Repositories for all projects (including root)
allprojects {
    repositories {
        maven { url = "https://maven.theillusivec4.top/" } // curios
        maven { url = "https://maven.kosmx.dev/" } // player animations
        maven {
            name = "ModMaven"
            url = "https://modmaven.dev/"
            content {
                includeGroup "mezz.jei"
            }
        }
        maven {
            url = "https://api.modrinth.com/maven"
        }
        maven {
            url = "https://maven.muon.rip/releases/"
        }
        exclusiveContent {
            forRepository {
                maven {
                    url "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }
    }
}
